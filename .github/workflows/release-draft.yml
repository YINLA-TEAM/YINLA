name: Create release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without a v prefix (for example 0.28.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with release history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.INPUT_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version ?? "")) {
            throw new Error("Version must be a stable SemVer such as 0.28.1");
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\n`);
          NODE

      - name: Ensure version is unused and lock main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag $RELEASE_VERSION already exists" >&2
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists" >&2
            exit 1
          fi
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Generate AI release notes
        env:
          EXPTECH_API_KEY: ${{ secrets.EXPTECH_API_KEY }}
          RELEASE_AI_MODEL: ${{ vars.RELEASE_AI_MODEL }}
          RELEASE_AI_BASE_URL: ${{ vars.RELEASE_AI_BASE_URL }}
        run: >-
          node scripts/generate-release-notes.js
          --version "$RELEASE_VERSION"
          --target "$RELEASE_TARGET"
          --output "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_VERSION"
          --target "$RELEASE_TARGET"
          --draft
          --title "YINLA v$RELEASE_VERSION"
          --notes-file "$RUNNER_TEMP/release-notes.md"
